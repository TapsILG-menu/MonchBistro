<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monch Bistro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500;600&display=swap">
<style>
:root{
  --bg:#ffffff; --ink:#000000; --muted:#555555; --accent:#000000; --btn:#000000; --btn-ink:#ffffff; --line:#cfcfcf; --glass:#ffffffcc;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e0e0e; --ink:#ffffff; --muted:#b3b3b3; --accent:#ffffff; --btn:#ffffff; --btn-ink:#000000; --line:#3a3a3a; --glass:#1a1a1a99;}
}
:root[data-theme="dark"]{--bg:#0e0e0e; --ink:#ffffff; --muted:#b3b3b3; --accent:#ffffff; --btn:#ffffff; --btn-ink:#000000; --line:#3a3a3a; --glass:#1a1a1a99;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Outfit',system-ui,sans-serif;display:flex;justify-content:center;height:100%;overflow:hidden}
.page{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;position:relative;overflow-y:auto}

.hero{position:relative;flex:1 1 0;min-height:150px;overflow:hidden;background:var(--bg)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 60%;animation:settle 1.8s cubic-bezier(.2,.7,.2,1) both}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 85%,var(--bg) 98%)}
@keyframes settle{from{transform:scale(1.1);opacity:.6}to{transform:scale(1);opacity:1}}

.name{margin-top:-14px;position:relative;z-index:1;padding:0 28px;text-align:center}
.name h1{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:54px;line-height:1;letter-spacing:.02em}
.name p{margin:12px 0 0;color:var(--muted);font-size:15px;font-weight:300;letter-spacing:.08em}
.rule{width:56px;height:1px;background:var(--accent);margin:20px auto 0}

.links{display:flex;flex-direction:column;gap:8px;padding:20px 24px 4px}
.row{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(6px);color:var(--ink);text-decoration:none;transition:border-color .2s,transform .2s}
.row:hover{border-color:var(--accent);transform:translateY(-1px)}
.row:focus-visible,.cta a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.ic{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.ic svg{width:20px;height:20px;fill:var(--accent)}
.tx{flex:1;font-weight:500;font-size:17px}
.tx small{display:block;font-weight:300;font-size:13px;color:var(--muted);margin-top:1px}
.chev{width:18px;height:18px;color:var(--muted)}
button.row{width:100%;font:inherit;text-align:left;cursor:pointer}
#wifiBtn .chev{transition:transform .25s}
#wifiBtn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.wifi-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s ease}
.wifi-panel.open{grid-template-rows:1fr}
.wifi-inner{overflow:hidden;min-height:0}
.wifi-body{text-align:center;padding:6px 0 10px}
.wifi-body .qrbox{margin:8px auto 12px}
.wifi-body p{margin:0 auto;max-width:300px;color:var(--muted);font-size:15px;font-weight:300;line-height:1.4}
@media (prefers-reduced-motion:reduce){.wifi-panel,#wifiBtn .chev{transition:none}}
dialog{border:1px solid var(--line);border-radius:20px;background:var(--bg);color:var(--ink);padding:26px 24px 22px;width:calc(100% - 48px);max-width:340px;text-align:center;font-family:'Outfit',system-ui,sans-serif}
dialog::backdrop{background:#000000b3}
.qrbox{width:220px;height:220px;margin:16px auto 14px;background:#fff;border:2px dashed var(--accent);border-radius:14px;display:grid;place-items:center;padding:20px;color:#333333;font-size:14px}
.qrbox img{width:100%;height:100%}
dialog h2{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-size:32px;font-weight:600}
dialog p{margin:6px 0 0;color:var(--muted);font-size:15px;font-weight:300;line-height:1.4}
.close{margin-top:18px;width:100%;padding:13px;border-radius:12px;border:1px solid var(--accent);background:transparent;color:var(--ink);font:inherit;font-weight:500;cursor:pointer}
.close:focus-visible,button.row:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.cta{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 24px 4px}
.cta a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 12px;border-radius:14px;text-decoration:none;font-weight:500;font-size:17px;text-align:center;transition:transform .2s}
.cta a:hover{transform:translateY(-1px)}
.cta small{font-weight:300;font-size:13px;opacity:.85}
.cta svg{width:22px;height:22px}
.primary{background:var(--btn);color:var(--btn-ink)} .primary svg{fill:var(--btn-ink)}
.stars{display:flex;gap:3px} .stars svg{width:14px;height:14px}
.second{border:1px solid var(--accent);color:var(--ink)} .second svg{fill:var(--accent)}

footer{flex:none;padding:14px 24px 16px;text-align:center;color:var(--muted);font-size:13px;font-weight:300;letter-spacing:.04em}
footer strong{color:var(--ink);font-weight:500}
@media (max-height:720px){.name h1{font-size:42px}.name{margin-top:-10px}.rule{margin-top:12px}.tx small,.cta small{display:none}.ic{width:36px;height:36px}.links{padding-top:14px}}
@media (prefers-reduced-motion:reduce){.hero img{animation:none}.row,.cta a{transition:none}}
</style>
</head>
